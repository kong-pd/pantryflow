<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PantryFlow Database ERD</title>
  <desc id="desc">Classic draw.io-style entity relationship diagram showing inventory lifecycle and request status fields.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #555; }
      .table { fill: #fff; stroke: #6c8ebf; stroke-width: 1.8; }
      .header { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.8; }
      .table-title { font-size: 21px; font-weight: 700; }
      .field { font-size: 14px; }
      .field-name { font-size: 14px; font-weight: 700; }
      .key { font-size: 12px; font-weight: 700; }
      .small { font-size: 12px; fill: #444; }
      .relation { font-size: 15px; font-weight: 700; }
      .note { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
      .note-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .rowline { stroke: #d0d0d0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="46" text-anchor="middle" class="title">PantryFlow - Entity Relationship Diagram</text>
  <text x="800" y="74" text-anchor="middle" class="subtitle">Two-table relational model with retained request and inventory history</text>

  <rect x="70" y="125" width="650" height="590" class="table"/>
  <rect x="70" y="125" width="650" height="58" class="header"/>
  <text x="395" y="161" text-anchor="middle" class="table-title">food_items</text>

  <text x="90" y="220" class="key">PK</text><text x="140" y="220" class="field-name">id</text><text x="360" y="220" class="field">INT UNSIGNED [NN, AI]</text>
  <line x1="85" y1="238" x2="705" y2="238" class="rowline"/>
  <text x="140" y="265" class="field-name">name</text><text x="360" y="265" class="field">VARCHAR(100) [NN]</text>
  <line x1="85" y1="283" x2="705" y2="283" class="rowline"/>
  <text x="140" y="310" class="field-name">quantity</text><text x="360" y="310" class="field">INT UNSIGNED [NN, DEFAULT 0]</text>
  <line x1="85" y1="328" x2="705" y2="328" class="rowline"/>
  <text x="140" y="355" class="field-name">expiry_date</text><text x="360" y="355" class="field">DATE [NULL]</text>
  <line x1="85" y1="373" x2="705" y2="373" class="rowline"/>
  <text x="140" y="400" class="field-name">is_active</text><text x="360" y="400" class="field">TINYINT(1) [NN, DEFAULT 1]</text>
  <line x1="85" y1="418" x2="705" y2="418" class="rowline"/>
  <text x="140" y="445" class="field-name">archived_at</text><text x="360" y="445" class="field">TIMESTAMP [NULL]</text>
  <line x1="85" y1="463" x2="705" y2="463" class="rowline"/>
  <text x="140" y="490" class="field-name">created_at</text><text x="360" y="490" class="field">TIMESTAMP [DEFAULT CURRENT_TIMESTAMP]</text>
  <line x1="85" y1="508" x2="705" y2="508" class="rowline"/>
  <text x="90" y="548" class="small">Indexes</text>
  <text x="140" y="578" class="body">name · quantity · expiry_date · is_active</text>
  <rect x="105" y="625" width="580" height="55" fill="#f5f5f5" stroke="#999"/>
  <text x="395" y="648" text-anchor="middle" class="small">Archived rows remain joinable but public queries require</text>
  <text x="395" y="668" text-anchor="middle" class="field-name">is_active = 1</text>

  <rect x="880" y="95" width="650" height="650" class="table"/>
  <rect x="880" y="95" width="650" height="58" class="header"/>
  <text x="1205" y="131" text-anchor="middle" class="table-title">client_requests</text>

  <text x="900" y="190" class="key">PK</text><text x="950" y="190" class="field-name">id</text><text x="1180" y="190" class="field">INT UNSIGNED [NN, AI]</text>
  <line x1="895" y1="208" x2="1515" y2="208" class="rowline"/>
  <text x="950" y="235" class="field-name">client_name</text><text x="1180" y="235" class="field">VARCHAR(100) [NN]</text>
  <line x1="895" y1="253" x2="1515" y2="253" class="rowline"/>
  <text x="950" y="280" class="field-name">contact</text><text x="1180" y="280" class="field">VARCHAR(30) [NN]</text>
  <line x1="895" y1="298" x2="1515" y2="298" class="rowline"/>
  <text x="950" y="325" class="field-name">pickup_date</text><text x="1180" y="325" class="field">DATE [NN]</text>
  <line x1="895" y1="343" x2="1515" y2="343" class="rowline"/>
  <text x="900" y="370" class="key">FK</text><text x="950" y="370" class="field-name">food_item_id</text><text x="1180" y="370" class="field">INT UNSIGNED [NN]</text>
  <line x1="895" y1="388" x2="1515" y2="388" class="rowline"/>
  <text x="950" y="415" class="field-name">requested_qty</text><text x="1180" y="415" class="field">INT UNSIGNED [NN, CHECK &gt; 0]</text>
  <line x1="895" y1="433" x2="1515" y2="433" class="rowline"/>
  <text x="950" y="460" class="field-name">status</text><text x="1180" y="460" class="field">ENUM(pending, rejected) [NN]</text>
  <line x1="895" y1="478" x2="1515" y2="478" class="rowline"/>
  <text x="950" y="505" class="field-name">reviewed_at</text><text x="1180" y="505" class="field">TIMESTAMP [NULL]</text>
  <line x1="895" y1="523" x2="1515" y2="523" class="rowline"/>
  <text x="950" y="550" class="field-name">created_at</text><text x="1180" y="550" class="field">TIMESTAMP [DEFAULT CURRENT_TIMESTAMP]</text>
  <line x1="895" y1="568" x2="1515" y2="568" class="rowline"/>
  <text x="900" y="608" class="small">Indexes</text>
  <text x="950" y="638" class="body">food_item_id · pickup_date · status</text>
  <rect x="915" y="675" width="580" height="42" fill="#f5f5f5" stroke="#999"/>
  <text x="1205" y="701" text-anchor="middle" class="small">Rejected requests are retained as audit records</text>

  <path d="M720 370 H880" fill="none" stroke="#404040" stroke-width="2"/>
  <line x1="746" y1="348" x2="746" y2="392" stroke="#404040" stroke-width="2"/>
  <line x1="760" y1="348" x2="760" y2="392" stroke="#404040" stroke-width="2"/>
  <circle cx="844" cy="370" r="8" fill="#fff" stroke="#404040" stroke-width="2"/>
  <path d="M880 370 L852 348 M880 370 L852 392" fill="none" stroke="#404040" stroke-width="2"/>
  <text x="752" y="330" text-anchor="middle" class="relation">1</text>
  <text x="852" y="330" text-anchor="middle" class="relation">0..*</text>
  <text x="800" y="420" text-anchor="middle" class="small">food_item_id → id</text>

  <rect x="70" y="790" width="1460" height="165" class="note"/>
  <text x="95" y="827" class="note-title">Lifecycle and integrity rules</text>
  <text x="95" y="858" class="body">• Creating a request inserts a pending row and decrements stock in one transaction.</text>
  <text x="95" y="886" class="body">• Rejecting a pending request preserves the row and restores requested_qty exactly once in one transaction.</text>
  <text x="95" y="914" class="body">• Archive and restore change food_items.is_active; archived items remain available to historical joins.</text>
  <text x="95" y="942" class="body">• Permanent deletion requires an archived item with zero references; ON DELETE RESTRICT remains the final safeguard.</text>
</svg>
