<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PantryFlow System Architecture</title>
  <desc id="desc">Classic draw.io-style three-tier architecture for the PantryFlow PHP and MySQL application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#404040"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #555; }
      .group { fill: #fff; stroke: #808080; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .group-title { font-size: 19px; font-weight: 700; }
      .box { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
      .box-green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.5; }
      .box-red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; }
      .box-gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.5; }
      .note { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
      .node { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #444; }
      .edge { fill: none; stroke: #404040; stroke-width: 1.8; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #404040; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">PantryFlow - System Architecture</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">Three-tier client-server architecture (XAMPP, PHP, PDO and MySQL/MariaDB)</text>

  <!-- Client tier -->
  <rect x="55" y="125" width="390" height="650" class="group"/>
  <text x="75" y="157" class="group-title">Client Tier</text>

  <rect x="95" y="195" width="310" height="70" rx="4" class="box-gray"/>
  <text x="250" y="224" text-anchor="middle" class="node">Visitor / Administrator</text>
  <text x="250" y="248" text-anchor="middle" class="small">Uses a desktop or mobile browser</text>

  <rect x="95" y="320" width="310" height="135" rx="4" class="box"/>
  <text x="250" y="351" text-anchor="middle" class="node">Web Browser</text>
  <text x="250" y="381" text-anchor="middle" class="body">HTML5 user interface</text>
  <text x="250" y="405" text-anchor="middle" class="body">Responsive CSS</text>
  <text x="250" y="429" text-anchor="middle" class="body">Vanilla JavaScript</text>

  <rect x="95" y="510" width="310" height="105" rx="4" class="note"/>
  <text x="250" y="541" text-anchor="middle" class="node">Client-side validation</text>
  <text x="250" y="570" text-anchor="middle" class="body">Required fields, phone, date</text>
  <text x="250" y="594" text-anchor="middle" class="body">and requested quantity</text>

  <rect x="95" y="665" width="310" height="65" rx="4" class="box-gray"/>
  <text x="250" y="693" text-anchor="middle" class="body">Public pages + admin interface</text>
  <text x="250" y="716" text-anchor="middle" class="small">Browser validation is not authoritative</text>

  <!-- Application tier -->
  <rect x="505" y="105" width="610" height="690" class="group"/>
  <text x="525" y="137" class="group-title">Application Tier - Apache / PHP</text>

  <rect x="560" y="170" width="500" height="64" rx="4" class="box-red"/>
  <text x="810" y="198" text-anchor="middle" class="node">Apache Web Server</text>
  <text x="810" y="220" text-anchor="middle" class="small">Receives HTTP requests and invokes PHP scripts</text>

  <rect x="545" y="285" width="250" height="125" rx="4" class="box"/>
  <text x="670" y="315" text-anchor="middle" class="node">Public PHP Pages</text>
  <text x="670" y="344" text-anchor="middle" class="body">index.php</text>
  <text x="670" y="368" text-anchor="middle" class="body">request.php</text>
  <text x="670" y="392" text-anchor="middle" class="body">history.php · login.php</text>

  <rect x="825" y="285" width="250" height="125" rx="4" class="box-red"/>
  <text x="950" y="315" text-anchor="middle" class="node">Protected PHP Pages</text>
  <text x="950" y="344" text-anchor="middle" class="body">dashboard.php · add-item.php</text>
  <text x="950" y="368" text-anchor="middle" class="body">reject-request.php</text>
  <text x="950" y="392" text-anchor="middle" class="body">inventory-action.php · logout.php</text>

  <rect x="545" y="465" width="250" height="130" rx="4" class="note"/>
  <text x="670" y="496" text-anchor="middle" class="node">Business Logic</text>
  <text x="670" y="525" text-anchor="middle" class="body">Validation + item state</text>
  <text x="670" y="549" text-anchor="middle" class="body">Atomic reserve / restore</text>
  <text x="670" y="573" text-anchor="middle" class="body">PRG + lifecycle guards</text>

  <rect x="825" y="465" width="250" height="130" rx="4" class="box-red"/>
  <text x="950" y="496" text-anchor="middle" class="node">Authentication</text>
  <text x="950" y="525" text-anchor="middle" class="body">Hardcoded admin account</text>
  <text x="950" y="549" text-anchor="middle" class="body">PHP Session state</text>
  <text x="950" y="573" text-anchor="middle" class="body">Route access guard</text>

  <rect x="655" y="660" width="310" height="75" rx="4" class="box-green"/>
  <text x="810" y="690" text-anchor="middle" class="node">PDO Data Access</text>
  <text x="810" y="716" text-anchor="middle" class="body">Prepared statements + row-locking transactions</text>

  <!-- Data tier -->
  <rect x="1170" y="125" width="375" height="650" class="group"/>
  <text x="1190" y="157" class="group-title">Data Tier</text>

  <path d="M1220 265 C1220 235 1495 235 1495 265 V580 C1495 610 1220 610 1220 580 Z" class="box-green"/>
  <ellipse cx="1357.5" cy="265" rx="137.5" ry="30" class="box-green"/>
  <ellipse cx="1357.5" cy="580" rx="137.5" ry="30" class="box-green"/>
  <text x="1358" y="320" text-anchor="middle" class="node">MySQL / MariaDB</text>
  <line x1="1245" y1="350" x2="1470" y2="350" stroke="#82b366"/>
  <text x="1358" y="392" text-anchor="middle" class="body">pantryflow database</text>
  <rect x="1260" y="425" width="195" height="52" rx="2" fill="#fff" stroke="#82b366"/>
  <text x="1358" y="457" text-anchor="middle" class="body">food_items · is_active</text>
  <rect x="1260" y="495" width="195" height="52" rx="2" fill="#fff" stroke="#82b366"/>
  <text x="1358" y="527" text-anchor="middle" class="body">client_requests · status</text>

  <!-- Connectors -->
  <path d="M250 265 V320" class="edge"/>
  <path d="M250 455 V510" class="edge"/>

  <path d="M405 370 H470 V202 H560" class="edge"/>
  <text x="455" y="350" text-anchor="end" class="edge-label">HTTP GET / POST</text>

  <path d="M560 218 H485 V420 H405" class="edge"/>
  <text x="475" y="442" text-anchor="end" class="edge-label">HTML / 302 redirect</text>

  <path d="M810 234 V285" class="edge"/>
  <path d="M670 410 V465" class="edge"/>
  <path d="M950 410 V465" class="edge"/>
  <path d="M670 595 V625 H810 V660" class="edge"/>
  <path d="M950 595 V625 H810" class="edge"/>

  <path d="M965 697 H1125 V420 H1220" class="edge-both"/>
  <text x="1085" y="681" text-anchor="middle" class="edge-label">Prepared SQL / results</text>

  <rect x="95" y="825" width="1410" height="45" rx="2" class="note"/>
  <text x="800" y="853" text-anchor="middle" class="body">Trust boundary: PHP authorises every lifecycle POST; MySQL persists statuses, history and atomic inventory changes.</text>
</svg>
